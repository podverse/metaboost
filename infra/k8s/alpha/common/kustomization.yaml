# Shared metaboost-product-membership-config: compose here so one Argo child app owns it; api and
# management-api deployments only reference it via envFrom.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metaboost-alpha

resources:
  - namespace.yaml
  - https://github.com/podverse/metaboost//infra/k8s/base/product-membership?ref=X.Y.Z-staging.N
