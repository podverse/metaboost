# Pattern: Suspended CronJob (Manual Trigger Only)
# Verifies extension/baseline/grant bootstrap contract for app and management databases.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: metaboost-db-verify-bootstrap-contract
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          annotations:
            metaboost.example.org/migration-job: bootstrap-contract
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: verify-bootstrap-contract
              image: postgres:18.3
              imagePullPolicy: Always
              command:
                - bash
                - /opt/scripts/database/verify-bootstrap-contract.sh
              envFrom:
                - secretRef:
                    name: metaboost-db-secrets
              env:
                - name: DB_HOST
                  value: metaboost-db
                - name: DB_PORT
                  value: "5432"
                - name: MIGRATION_BUNDLE_SHA
                  valueFrom:
                    configMapKeyRef:
                      name: metaboost-ops-migration-runtime
                      key: MIGRATION_BUNDLE_SHA
              volumeMounts:
                - name: migration-runtime
                  mountPath: /opt/scripts/database
                  readOnly: true
          volumes:
            - name: migration-runtime
              configMap:
                name: metaboost-ops-migration-runtime
                defaultMode: 0555
